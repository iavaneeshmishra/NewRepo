# XcodeGen spec — run `xcodegen generate` in this directory to produce Ripple.xcodeproj.
# (brew install xcodegen). The generated project is git-ignored; this file is the source of truth.
name: Ripple
options:
  bundleIdPrefix: app.ripple
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""       # set your team id here or in Xcode's Signing tab
    CODE_SIGN_STYLE: Automatic

targets:
  Ripple:
    type: application
    platform: iOS
    sources:
      - path: Ripple
    info:
      path: Ripple/Resources/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ripple.mesh
        INFOPLIST_FILE: Ripple/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
        TARGETED_DEVICE_FAMILY: "1"
    dependencies: []

  RippleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RippleTests
      - path: ../protocol/test-vectors.json
        buildPhase: resources
    dependencies:
      - target: Ripple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ripple.mesh.tests

schemes:
  Ripple:
    build:
      targets:
        Ripple: all
        RippleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RippleTests
