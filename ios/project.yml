# XcodeGen spec — run `xcodegen generate` in this directory to produce Ripple.xcodeproj.
# (brew install xcodegen). The generated project is git-ignored; this file is the source of truth.
name: Ripple
options:
  bundleIdPrefix: app.ripple
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Emit a project format Xcode 15 can open (XcodeGen ≥ 2.43 defaults to Xcode 16's format 77).
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""       # set your team id here or in Xcode's Signing tab

targets:
  Ripple:
    type: application
    platform: iOS
    sources:
      - Ripple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ripple.mesh
        INFOPLIST_FILE: Ripple/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
        TARGETED_DEVICE_FAMILY: "1"

  RippleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RippleTests
    dependencies:
      - target: Ripple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ripple.mesh.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ripple:
    build:
      targets:
        Ripple: all
        RippleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RippleTests
