name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  protocol:
    name: Protocol reference + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/protocol/test.js
      - name: Vectors are up to date
        run: node tools/protocol/gen-vectors.js && git diff --exit-code protocol/test-vectors.json

  android:
    name: Android unit tests + debug build
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ripple-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS unit tests
    runs-on: macos-14
    needs: protocol
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: |
          xcodebuild test -scheme Ripple -project Ripple.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
        working-directory: ios
