name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  protocol:
    name: Protocol reference + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: node tools/protocol/test.js
      - name: Vectors are up to date (and copies in both apps match)
        run: |
          node tools/protocol/gen-vectors.js && git diff --exit-code protocol/test-vectors.json
          cmp protocol/test-vectors.json android/app/src/test/resources/test-vectors.json
          cmp protocol/test-vectors.json ios/RippleTests/Resources/test-vectors.json

  android:
    name: Android unit tests + debug build
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Bootstrap Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
      - name: Build and test
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain 2>&1 | tee gradle.log
      - name: Summarize errors
        if: always()
        working-directory: android
        run: |
          {
            echo "### Android build errors"
            echo '```'
            grep -E "^e: |error:|FAILED|Test.*FAILED|tests completed|BUILD " gradle.log | sed 's#/home/runner/work/NewRepo/NewRepo/##' | sort -u | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > android-errors.md
      - name: Comment errors on PR
        if: failure() && github.event_name == 'pull_request'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file android/android-errors.md
      - uses: actions/upload-artifact@v6
        with:
          name: ripple-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  android-release-smoke:
    name: Android release-build smoke (R8/minify, unsigned)
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Bootstrap Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
      # Catches R8/minify breakage on PRs instead of only at tag time. No
      # signing secrets are referenced here (the release workflow is the only
      # job that injects RIPPLE_* signing env), so the bundle is unsigned and
      # nothing is uploaded to any release.
      - name: Build unsigned release bundle (exercises R8)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --console=plain
      - name: Verify merged release manifest has no INTERNET permission
        working-directory: android
        run: |
          set -euo pipefail
          mapfile -d '' manifests < <(find app/build/intermediates -path '*release*' -path '*merged_manifest*' -name AndroidManifest.xml -print0)
          if [[ "${#manifests[@]}" -eq 0 ]]; then
            echo "Could not find a merged release manifest." >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            if grep -q 'android.permission.INTERNET' "$manifest"; then
              echo "Forbidden INTERNET permission found in $manifest" >&2
              exit 1
            fi
          done
          echo "Verified ${#manifests[@]} merged release manifest(s): no INTERNET permission."
      - name: Assert exactly one release AAB is produced
        working-directory: android
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(app/build/outputs/bundle/release/*.aab)
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            echo "Expected exactly one release AAB, found ${#bundles[@]}." >&2
            exit 1
          fi
          echo "One release AAB produced: ${bundles[0]}"

  ios:
    name: iOS unit tests
    runs-on: macos-15
    needs: protocol
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: |
          {
            echo "### iOS environment"; echo '```'
            sw_vers; xcodebuild -version; xcodegen --version
            echo "--- xcodegen generate"; xcodegen generate 2>&1 | tee xcodegen.log
            echo "--- project"; ls -la Ripple.xcodeproj || true
            echo "--- project.pbxproj (head)"; head -c 600 Ripple.xcodeproj/project.pbxproj || true
            echo "--- schemes"; xcodebuild -list -project Ripple.xcodeproj 2>&1 | head -30 || true
            echo '```'
          } > env.md; cat env.md
      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -scheme Ripple -project Ripple.xcodeproj \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            -resultBundlePath TestResults.xcresult 2>&1 | tee xcodebuild.log | grep -E "error:|Test Case|Test Suite|Executed|BUILD|TEST" || true
          test ${PIPESTATUS[0]} -eq 0
          grep -q "Test Suite 'All tests' passed" xcodebuild.log
      - name: Summarize errors
        if: always()
        working-directory: ios
        run: |
          {
            cat env.md
            echo "### iOS build errors"
            echo '```'
            grep -E "error:|Executed|Test Suite 'All tests'|\*\* (BUILD|TEST) " xcodebuild.log | sed 's#/Users/runner/work/NewRepo/NewRepo/##' | sort -u | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > ios-errors.md
      - name: Comment errors on PR
        if: failure() && github.event_name == 'pull_request'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file ios/ios-errors.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-xcodebuild-log
          path: ios/xcodebuild.log
