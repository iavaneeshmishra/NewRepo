name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  protocol:
    name: Protocol reference + vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/protocol/test.js
      - name: Vectors are up to date
        run: node tools/protocol/gen-vectors.js && git diff --exit-code protocol/test-vectors.json

  android:
    name: Android unit tests + debug build
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ripple-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS unit tests
    runs-on: macos-14
    needs: protocol
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -scheme Ripple -project Ripple.xcodeproj \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            -resultBundlePath TestResults.xcresult 2>&1 | tee xcodebuild.log | grep -E "error:|warning: |Test Case|Test Suite|Executed|BUILD|TEST" || true
          test ${PIPESTATUS[0]} -eq 0
          grep -q "Test Suite 'All tests' passed" xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xcodebuild-log
          path: ios/xcodebuild.log
