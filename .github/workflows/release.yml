name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-release:
    name: Android release AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure signing when all secrets are present
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done

          if [[ "$present" -eq 0 ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "label=unsigned" >> "$GITHUB_OUTPUT"
            echo "No Android signing secrets found; building the documented unsigned AAB."
          elif [[ "$present" -ne 4 ]]; then
            echo "Signing is only safe when all four Android secrets are configured." >&2
            exit 1
          else
            keystore="$RUNNER_TEMP/ripple-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            {
              echo "RIPPLE_KEYSTORE_PATH=$keystore"
              echo "RIPPLE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "RIPPLE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "RIPPLE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "label=signed" >> "$GITHUB_OUTPUT"
            echo "Complete signing configuration found; the AAB will be signed."
          fi

      - name: Bootstrap Gradle wrapper
        working-directory: android
        run: |
          if [[ ! -f gradlew ]]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --console=plain

      - name: Verify merged manifest has no INTERNET permission
        working-directory: android
        run: |
          set -euo pipefail
          mapfile -d '' manifests < <(find app/build/intermediates -path '*release*' -path '*merged_manifest*' -name AndroidManifest.xml -print0)
          if [[ "${#manifests[@]}" -eq 0 ]]; then
            echo "Could not find a merged release manifest." >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            if grep -q 'android.permission.INTERNET' "$manifest"; then
              echo "Forbidden INTERNET permission found in $manifest" >&2
              exit 1
            fi
          done
          echo "Verified ${#manifests[@]} merged release manifest(s): no INTERNET permission."

      - name: Package release artifacts and signing instructions
        id: package
        working-directory: android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          LABEL: ${{ steps.signing.outputs.label }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(app/build/outputs/bundle/release/*.aab)
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            echo "Expected exactly one release AAB, found ${#bundles[@]}." >&2
            exit 1
          fi
          safe_ref="${GITHUB_REF_NAME//\//-}"
          mkdir -p release-artifacts
          aab="release-artifacts/ripple-${safe_ref}-${LABEL}.aab"
          cp "${bundles[0]}" "$aab"
          cp ../docs/RELEASING.md release-artifacts/RELEASING.md
          if [[ "$SIGNED" == "true" ]]; then
            jarsigner -verify "$aab"
            cat > release-artifacts/SIGNING-NOTICE.txt <<'NOTICE'
          This AAB was signed by GitHub Actions with the configured Ripple upload key.
          Verify the tag, workflow run, and certificate before uploading it.
          See RELEASING.md for the Play internal-track procedure.
          NOTICE
          else
            cat > release-artifacts/SIGNING-NOTICE.txt <<'NOTICE'
          UNSIGNED AAB — do not upload this file to Google Play.
          Configure all four Android repository secrets and rerun this workflow,
          or follow the local signing instructions in RELEASING.md.
          NOTICE
          fi
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [[ -f "$mapping" ]]; then cp "$mapping" release-artifacts/mapping.txt; fi
          echo "aab_path=android/$aab" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ripple-android-${{ github.ref_name }}-${{ steps.signing.outputs.label }}
          path: android/release-artifacts/
          if-no-files-found: error

      - name: Attach tag builds to a GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          AAB_PATH: ${{ steps.package.outputs.aab_path }}
          SIGNING_LABEL: ${{ steps.signing.outputs.label }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Ripple $GITHUB_REF_NAME" \
              --notes "Android ${SIGNING_LABEL} release bundle produced from tagged commit $GITHUB_SHA. See the attached signing notice and docs/RELEASING.md."
          fi
          gh release upload "$GITHUB_REF_NAME" "$AAB_PATH" \
            android/release-artifacts/SIGNING-NOTICE.txt \
            android/release-artifacts/RELEASING.md --clobber
